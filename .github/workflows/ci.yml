name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      dsh: ${{ steps.read.outputs.dsh }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          versions=$(grep -v '^#' dsh-versions.txt | grep -v '^[[:space:]]*$' | jq -R . | jq -s -c .)
          echo "dsh=$versions" >> "$GITHUB_OUTPUT"

  notes-lint:
    # Agent Note structure and required sections (see .agents/notes/AGENTS.md).
    # A slimmed-down port of deepseek-harness's agent-note gates: no bilingual
    # pairing, no archive machinery — just the shape and the mandatory sections.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/verify-agent-notes.mjs

  build-and-test:
    # Per-version API checks: compile and test against each DSH version's
    # @deepseek-ai/* APIs, plus the host-export and host contract checks.
    # This job never packs: the CI tarball is built exactly once (see `pack`
    # below) so every DSH version boots the identical tarball.
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: ${{ fromJson(needs.versions.outputs.dsh) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Pin @deepseek-ai/* devDependencies to the matrix DSH version
        env:
          DSH_VERSION: ${{ matrix.dsh }}
        run: |
          node -e "
            const fs = require('fs')
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            const version = process.env.DSH_VERSION
            // Only the build inputs move: peerDependencies are the shipped
            // exact-version disjunction and must stay identical in every
            // job, since one packed tarball serves the whole window.
            // cordis and schemastery are versioned independently of DSH.
            const isDshPrerelease = (v) => /^\\d+\\.\\d+\\.\\d+-(alpha|beta|rc)(\\.|$)/.test(String(v).replace(/^[~^]/, ''))
            for (const [name, current] of Object.entries(pkg.devDependencies ?? {})) {
              if (name.startsWith('@deepseek-ai/') && isDshPrerelease(current)) pkg.devDependencies[name] = version
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          "
          grep '"@deepseek-ai/dsh-llm"' package.json
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Host-export check
        env:
          DSH_VERSION: ${{ matrix.dsh }}
        run: node scripts/check-host-exports.mjs --dsh "$DSH_VERSION"
      - name: Host contract check
        # Icons, slot outlets, DOM markers, services, theme tokens, and the
        # shell's module table from src/client/host-contract.ts; tsc cannot
        # see any of these.
        env:
          DSH_VERSION: ${{ matrix.dsh }}
        run: node scripts/check-host-contract.mjs --dsh "$DSH_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: pass-build-${{ matrix.dsh }}
          path: dsh-versions.txt
          overwrite: true

  pack:
    # Build one CI tarball from the repository's pinned dependencies (the
    # window floor). The boot smoke and host E2E boot this exact tarball on
    # every DSH version — CI must never pack a per-version artifact, because
    # users install one release across the whole support window.
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: pack
        run: |
          # pnpm prints the full path of the tarball as its last line.
          TARBALL="$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-tarball
          path: ${{ steps.pack.outputs.tarball }}

  boot-smoke:
    # Boot smoke: install the packed tarball (no node_modules,
    # @deepseek-ai/* resolves from the host) and boot it on each DSH version.
    needs: [versions, pack]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: ${{ fromJson(needs.versions.outputs.dsh) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: plugin-tarball
          path: ${{ runner.temp }}/tarball
      - name: Boot smoke test
        env:
          DSH_VERSION: ${{ matrix.dsh }}
        run: |
          TARBALL="$(ls "${{ runner.temp }}/tarball"/*.tgz | head -1)"
          PLUGIN_SOURCE="$TARBALL" bash scripts/boot-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pass-boot-${{ matrix.dsh }}
          path: dsh-versions.txt
          overwrite: true

  host-e2e:
    # The same tarball inside a signed-in `dsh web`, driven through headless
    # Chrome: usage RPCs, model picker, one streamed Codex reply, the usage
    # pill in the host's stats row, and slot crashes (see docs/testing.md).
    # Provider traffic is answered by scripts/host-e2e-preload.mjs.
    needs: [versions, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dsh: ${{ fromJson(needs.versions.outputs.dsh) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: plugin-tarball
          path: ${{ runner.temp }}/tarball
      - name: Find Chrome
        # ubuntu-latest ships Chrome; install it only when the image lacks it.
        run: |
          if ! google-chrome --version; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y /tmp/chrome.deb
            google-chrome --version
          fi
      - name: Host E2E
        env:
          DSH_VERSION: ${{ matrix.dsh }}
          HOST_E2E_ARTIFACTS: ${{ runner.temp }}/host-e2e
        run: |
          TARBALL="$(ls "${{ runner.temp }}/tarball"/*.tgz | head -1)"
          PLUGIN_SOURCE="$TARBALL" bash scripts/host-e2e.sh
      - uses: actions/upload-artifact@v4
        # Screenshot, DOM, browser console, web.log, and the provider request
        # log of each failed browser attempt.
        if: failure()
        with:
          name: host-e2e-evidence-${{ matrix.dsh }}
          path: ${{ runner.temp }}/host-e2e
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: pass-e2e-${{ matrix.dsh }}
          path: dsh-versions.txt
          overwrite: true

  ci-gate:
    # Stable required check for branch protection. A successful matrix job
    # uploads a version-named marker; missing markers keep this gate red even
    # when GitHub reports a skipped dependent job as successful.
    name: CI gate
    if: ${{ always() }}
    needs: [versions, pack, build-and-test, boot-smoke, host-e2e, notes-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/ci-artifacts
      - name: Verify every version passed
        env:
          VERSIONS_RESULT: ${{ needs.versions.result }}
          PACK_RESULT: ${{ needs.pack.result }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          BOOT_RESULT: ${{ needs.boot-smoke.result }}
          E2E_RESULT: ${{ needs.host-e2e.result }}
          NOTES_RESULT: ${{ needs.notes-lint.result }}
        run: |
          failed=0
          for result in "$VERSIONS_RESULT" "$PACK_RESULT" "$BUILD_RESULT" "$BOOT_RESULT" "$E2E_RESULT" "$NOTES_RESULT"; do
            [[ "$result" == success ]] || failed=1
          done
          mapfile -t versions < <(grep -Ev '^#|^[[:space:]]*$' dsh-versions.txt)
          if ((${#versions[@]} == 0)); then
            echo 'No supported DSH versions were listed' >&2
            exit 1
          fi
          for version in "${versions[@]}"; do
            for job in build boot e2e; do
              marker="$RUNNER_TEMP/ci-artifacts/pass-$job-$version/dsh-versions.txt"
              if [[ ! -f "$marker" ]]; then
                echo "Missing successful $job check for DSH $version" >&2
                failed=1
              fi
            done
          done
          exit "$failed"
