# Fake credential refs for the usage-bar boot check. These are not provider
# secrets. The boot script copies this file to $DSH_HOME/.credentials.yaml
# and sets mode 0600; the harness refuses to read a credential file other
# users can open. Process environment wins over this file, so the boot
# script unsets OPENCODE_GO_API_KEY, KIMI_CODING_API_KEY, and
# CURSOR_SUBSCRIPTION_OAUTH before starting dsh.
version: 1
refs:
  OPENCODE_GO_API_KEY: fake-opencode-key
  KIMI_CODING_API_KEY: fake-kimi-key
  CURSOR_SUBSCRIPTION_OAUTH: '{"type":"oauth","access":"fake.eyJzdWIiOiJhdXRoMHx1c2VyX2JhciIsImV4cCI6NDEwMjQ0NDgwMH0.sig","refresh":"fake-cursor-refresh","expires":4102444800000}'
